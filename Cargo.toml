[workspace]
resolver = "3"
members = ["crates/core", "crates/market", "src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/GGuedesA/NasuaFrame"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
