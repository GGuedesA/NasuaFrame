# cargo-deny config: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
# Only fail on unmaintained crates we depend on directly. Tauri's Linux stack (gtk/glib, zbus)
# pulls in unmaintained crates we can't replace; security vulnerabilities still fail everywhere.
unmaintained = "workspace"

[licenses]
version = 2
# Permissive licenses compatible with Apache-2.0. No copyleft (GPL/AGPL).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow" # Tauri's dependency tree has many unavoidable duplicates
wildcards = "allow" # workspace path deps have no version

[sources]
unknown-registry = "deny"
unknown-git = "deny"
